name: Bouwen (Android APK, Windows, web)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - name: Afhankelijkheden
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Android-project maken + eigen plugin
        run: |
          npx cap add android
          node scripts/patch-android.js
          npx cap sync android
      - name: APK bouwen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Hernoemen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Klankstroom-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: Klankstroom-android, path: Klankstroom-android.apk }
      - name: Release (bij tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: Klankstroom-android.apk }

  windows:
    name: Windows-app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --win nsis portable --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: Klankstroom-windows
          path: |
            dist/*.exe
      - name: Release (bij tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: 'dist/*.exe' }

  pages:
    name: Webversie (GitHub Pages)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
      - id: deploy
        uses: actions/deploy-pages@v4
