name: Bouwen (Android APK, Windows, web)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: Android SDK (staat al op de runner)
        run: echo "sdk.dir=$ANDROID_HOME" && ls $ANDROID_HOME/platforms | tail -3
      - name: Afhankelijkheden
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Android-project maken + eigen plugin
        run: |
          npx cap add android
          node scripts/patch-android.js
          npx cap sync android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: APK bouwen (vaste sleutel, oplopend versienummer)
        working-directory: android
        env: { BUILD_NUMBER: '${{ github.run_number }}' }
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Hernoemen
        run: cp android/app/build/outputs/apk/release/app-release.apk Klankstroom.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: Klankstroom.apk }

  windows:
    name: Windows-app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --win nsis portable --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Klankstroom-Setup.exe
            dist/Klankstroom-portable.exe

  release:
    name: Release (downloadpagina)
    needs: [android, windows]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: Klankstroom 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            **Android:** download `Klankstroom.apk` en installeer (sta "onbekende bronnen" toe). Nieuwe versies installeren gewoon over de oude heen.
            **Windows:** `Klankstroom-Setup.exe` (installer) of `Klankstroom-portable.exe` (zonder installatie).
            **Web:** https://endless1977.github.io/MusicPlayer/
          files: |
            out/Klankstroom.apk
            out/Klankstroom-Setup.exe
            out/Klankstroom-portable.exe

  pages:
    name: Webversie (GitHub Pages)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: www }
      - id: deploy
        uses: actions/deploy-pages@v4
